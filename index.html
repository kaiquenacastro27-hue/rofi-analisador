<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROFI · Analisador</title>
<style>
:root{
  color-scheme: light;
  --page:#f6f6f3; --surface:#fcfcfb; --surface-2:#f0efec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300;
  --accent:#ee4d2d; --neutral:#a9a8a1;
  --radius:10px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-ink:#0ca30c; --neutral:#5d5c57;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-ink:#0ca30c; --neutral:#5d5c57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--s1)}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 60px}
header.top{position:sticky;top:0;z-index:30;background:var(--page);border-bottom:1px solid var(--grid)}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.fileinfo{margin-left:auto;color:var(--ink-2);font-size:13px;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.small{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:2px;padding:0 20px;max-width:1440px;margin:0 auto;overflow-x:auto}
nav.tabs a{padding:9px 12px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs a .count{display:inline-block;margin-left:6px;background:var(--surface-2);border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--ink-2)}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--grid);margin-bottom:18px}
.fgroup{display:flex;align-items:center;gap:6px}
.fgroup > label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--ring)}
.seg button.on{background:var(--ink);color:var(--surface)}
.chip{border:1px solid var(--ring);background:var(--surface);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=date],select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
input[type=number]{width:72px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
h2{font-size:18px;margin:6px 0 4px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:0 0 10px;font-weight:620}
.lead{color:var(--ink-2);margin:0 0 16px;max-width:900px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:16px;min-width:0}
.card.flush{padding:0}
.card .head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card .head h3{margin:0}
.card .head .sub{color:var(--muted);font-size:12.5px}
.card .head .actions{margin-left:auto;display:flex;gap:6px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--radius);padding:12px 14px}
.tile .l{color:var(--ink-2);font-size:12.5px}
.tile .v{font-size:24px;font-weight:620;margin-top:2px;letter-spacing:-.01em}
.tile .d{color:var(--muted);font-size:12px;margin-top:2px}
.tile.click{cursor:pointer}
.tile.click:hover{background:var(--surface-2)}
.tile.sel{outline:2px solid var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:12px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.pos{color:var(--good-ink)}
.neg{color:var(--crit)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend i.dot{width:9px;height:9px;border-radius:50%}
/* tabela */
.tblwrap{overflow:auto;max-height:620px;border-radius:0 0 var(--radius) var(--radius)}
table.t{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--axis);cursor:pointer;white-space:nowrap;user-select:none}
table.t th.num,table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t th .arr{color:var(--muted);margin-left:3px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tbody tr:hover td{background:var(--hover)}
table.t td.wrap{white-space:normal;width:340px;min-width:340px;max-width:340px;color:var(--ink-2)}
table.t td.nowrap{white-space:nowrap}
.tblbar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.tblbar h3{margin:0}
.tblbar .sub{color:var(--muted);font-size:12.5px}
.tblbar .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.more{padding:10px 16px;color:var(--muted);font-size:12.5px;display:flex;gap:10px;align-items:center}
/* barras */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;font-size:12.5px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .tr{position:relative;height:16px;display:flex;align-items:center}
.bar .fl{height:14px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar .vl{margin-left:6px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.click{cursor:pointer}
.bar.click:hover .lb{color:var(--ink)}
/* gráfico */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:120px;max-width:340px;display:none}
#tip .tt{font-weight:600;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .row span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* drop */
.drop{max-width:760px;margin:60px auto;text-align:center}
.dropzone{border:2px dashed var(--axis);border-radius:16px;padding:48px 24px;background:var(--surface);cursor:pointer;transition:.15s}
.dropzone.over{border-color:var(--accent);background:var(--surface-2)}
.dropzone h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
.dropzone p{color:var(--ink-2);margin:4px 0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;text-align:left}
.feat div{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:12px;font-size:13px;color:var(--ink-2)}
.feat b{display:block;color:var(--ink);margin-bottom:2px}
@media (max-width:700px){.feat{grid-template-columns:1fr}}
.progress{max-width:520px;margin:90px auto;text-align:center}
.pbar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.pbar div{height:100%;background:var(--accent);width:0;transition:width .15s}
.err{background:var(--surface);border:1px solid var(--crit);border-radius:10px;padding:14px;color:var(--ink);margin:20px auto;max-width:760px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.rule{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:10px 12px;cursor:pointer}
.rule:hover{background:var(--surface-2)}
.rule.sel{outline:2px solid var(--ink)}
.rule .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rule .n{font-size:20px;font-weight:620}
.rule .lbl{font-weight:600;font-size:13px}
.rule .ds{color:var(--muted);font-size:12px;margin-top:3px}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 18px;margin-top:10px}
.params label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.rec-card{border-left:4px solid var(--neutral)}
.motivos{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}
.motivos li{margin:3px 0}
.hl{display:grid;gap:8px}
.hl .it{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.hl .it .k{flex:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink-2);font-size:13px}
details.how{margin:-6px 0 14px}
details.how div{font-size:13px;color:var(--ink-2);padding:8px 0 0;max-width:980px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sim{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sim .big{font-size:22px;font-weight:620}
.hubpick{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.hubpick input{min-width:320px}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>ROFI <small>· analisador de roteirização</small></div>
    <div class="fileinfo" id="fileinfo"></div>
  </div>
  <nav class="tabs" id="tabs" hidden></nav>
</header>
<div class="wrap">
  <div id="filters" class="filters" hidden></div>
  <main id="main"></main>
</div>
<input type="file" id="file" accept=".xlsx,.xlsm" hidden>
<div id="tip"></div>
<div class="toast" id="toast"></div>
<script id="worker-src" type="text/plain">// ROFI Analyzer — leitor de XLSX em streaming (roda em Web Worker, sem bibliotecas externas)
// Lê o .xlsx direto do zip com DecompressionStream e processa o XML linha a linha.

const XL = (() => {
  const td = new TextDecoder('utf-8');

  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function u32(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }

  function readZipIndex(u8) {
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
      if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Arquivo não parece ser um .xlsx válido (zip não encontrado).');
    let count = u16(u8, eocd + 10);
    let cdOff = u32(u8, eocd + 16);
    // zip64
    if (cdOff === 0xffffffff || count === 0xffff) {
      const loc = eocd - 20;
      if (u32(u8, loc) === 0x07064b50) {
        const z64 = Number(new DataView(u8.buffer, u8.byteOffset).getBigUint64(loc + 8, true));
        const dv = new DataView(u8.buffer, u8.byteOffset);
        count = Number(dv.getBigUint64(z64 + 32, true));
        cdOff = Number(dv.getBigUint64(z64 + 48, true));
      }
    }
    const entries = {};
    let p = cdOff;
    for (let i = 0; i < count; i++) {
      if (u32(u8, p) !== 0x02014b50) break;
      const method = u16(u8, p + 10);
      let csize = u32(u8, p + 20);
      let usize = u32(u8, p + 24);
      const nlen = u16(u8, p + 28), xlen = u16(u8, p + 30), clen = u16(u8, p + 32);
      let lho = u32(u8, p + 42);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
      // zip64 extra
      if (csize === 0xffffffff || usize === 0xffffffff || lho === 0xffffffff) {
        let q = p + 46 + nlen; const end = q + xlen;
        const dv = new DataView(u8.buffer, u8.byteOffset);
        while (q < end) {
          const id = u16(u8, q), sz = u16(u8, q + 2);
          if (id === 1) {
            let r = q + 4;
            if (usize === 0xffffffff) { usize = Number(dv.getBigUint64(r, true)); r += 8; }
            if (csize === 0xffffffff) { csize = Number(dv.getBigUint64(r, true)); r += 8; }
            if (lho === 0xffffffff) { lho = Number(dv.getBigUint64(r, true)); r += 8; }
          }
          q += 4 + sz;
        }
      }
      entries[name] = { method, csize, usize, lho };
      p += 46 + nlen + xlen + clen;
    }
    return entries;
  }

  function entryStream(u8, e) {
    const nlen = u16(u8, e.lho + 26), xlen = u16(u8, e.lho + 28);
    const start = e.lho + 30 + nlen + xlen;
    const data = u8.subarray(start, start + e.csize);
    let s = new Blob([data]).stream();
    if (e.method === 8) s = s.pipeThrough(new DecompressionStream('deflate-raw'));
    else if (e.method !== 0) throw new Error('Compressão não suportada no xlsx: ' + e.method);
    return s.pipeThrough(new TextDecoderStream('utf-8'));
  }

  async function entryText(u8, entries, name) {
    const e = entries[name];
    if (!e) return null;
    const r = entryStream(u8, e).getReader();
    let out = '';
    for (;;) { const { done, value } = await r.read(); if (done) break; out += value; }
    return out;
  }

  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  function unesc(s) {
    if (s.indexOf('&') < 0 && s.indexOf('_x') < 0) return s;
    s = s.replace(/&(#x[0-9a-fA-F]+|#\d+|amp|lt|gt|quot|apos);/g, (m, g) => {
      if (g[0] === '#') return String.fromCodePoint(g[1] === 'x' ? parseInt(g.slice(2), 16) : parseInt(g.slice(1), 10));
      return ENT[g];
    });
    return s.replace(/_x([0-9A-Fa-f]{4})_/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  }

  function textOf(inner) {
    // concatena <t> (ignorando <rPh> fonético)
    inner = inner.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    let out = '', m; const re = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
    while ((m = re.exec(inner))) out += m[1] || '';
    return unesc(out);
  }

  async function sharedStrings(u8, entries, progress) {
    const e = entries['xl/sharedStrings.xml'];
    if (!e) return [];
    const r = entryStream(u8, e).getReader();
    const out = []; let buf = ''; let seen = 0;
    for (;;) {
      const { done, value } = await r.read();
      if (value) { buf += value; seen += value.length; }
      const last = buf.lastIndexOf('</si>');
      if (last >= 0 || done) {
        const chunk = done ? buf : buf.slice(0, last + 5);
        buf = done ? '' : buf.slice(last + 5);
        const re = /<si>([\s\S]*?)<\/si>|<si\/>/g; let m;
        while ((m = re.exec(chunk))) out.push(m[1] ? textOf(m[1]) : '');
        if (progress) progress(Math.min(1, seen / Math.max(1, e.usize)));
      }
      if (done) break;
    }
    return out;
  }

  function colIndex(ref) {
    let n = 0;
    for (let i = 0; i < ref.length; i++) {
      const c = ref.charCodeAt(i);
      if (c >= 65 && c <= 90) n = n * 26 + (c - 64); else break;
    }
    return n - 1;
  }

  async function sheetMap(u8, entries) {
    const wb = await entryText(u8, entries, 'xl/workbook.xml');
    const rels = await entryText(u8, entries, 'xl/_rels/workbook.xml.rels') || '';
    const relMap = {}; let m;
    const rre = /<Relationship\b([^>]*)\/?>/g;
    while ((m = rre.exec(rels))) {
      const a = m[1];
      const id = (a.match(/\bId="([^"]+)"/) || [])[1];
      let t = (a.match(/\bTarget="([^"]+)"/) || [])[1];
      if (!id || !t) continue;
      t = t.replace(/^\//, '');
      if (!t.startsWith('xl/')) t = 'xl/' + t;
      relMap[id] = t;
    }
    const sheets = [];
    const sre = /<sheet\b([^>]*)\/?>/g;
    while ((m = sre.exec(wb))) {
      const a = m[1];
      const name = unesc((a.match(/\bname="([^"]*)"/) || [])[1] || '');
      const rid = (a.match(/\br:id="([^"]+)"/) || a.match(/\bid="([^"]+)"/) || [])[1];
      sheets.push({ name, path: relMap[rid] });
    }
    return sheets;
  }

  // Lê uma aba linha a linha. onRow(arrayDeValores, indiceDaLinha) — retornar false interrompe.
  async function readSheet(u8, entries, path, sst, onRow, progress) {
    const e = entries[path];
    if (!e) throw new Error('Aba não encontrada no arquivo: ' + path);
    const r = entryStream(u8, e).getReader();
    let buf = '', seen = 0, rowNo = 0, stop = false;
    const rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
    const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    while (!stop) {
      const { done, value } = await r.read();
      if (value) { buf += value; seen += value.length; }
      let last = buf.lastIndexOf('</row>');
      const sc = buf.lastIndexOf('/>');
      if (last < 0 && !done) continue;
      const cut = done ? buf.length : last + 6;
      const chunk = buf.slice(0, cut);
      buf = buf.slice(cut);
      rowRe.lastIndex = 0; let rm;
      while ((rm = rowRe.exec(chunk))) {
        const ra = rm[1];
        const rn = ra.match(/\br="(\d+)"/);
        const idx = rn ? parseInt(rn[1], 10) - 1 : rowNo;
        rowNo = idx + 1;
        const inner = rm[2];
        const row = [];
        if (inner) {
          cRe.lastIndex = 0; let cm, ci = 0;

  function daily(list, kf) {

  // ---------- tabela de hubs ----------
  function hubTable(model, list, opts) {

    const dates = [...new Set(list.map(o => o.date))].sort();

  // ---------- regressão (mínimos quadrados ponderados) ----------
  function wls(X, y, w) {
    const k = X[0].length; const A = Array.from({ length: k }, () => new Array(k).fill(0)); const b = new Array(k).fill(0);

    }
    return b.map((v, i) => v / A[i][i]);
  }

  const DEFAULT_PARAMS = { minDias: 5, gap: 6, orfMax: 0.5, nrMax: 0.5, alertaOrf: 1.0, alertaNr: 1.0, passoMax: 8, cvMax: 30 };

  function sprRecommend(rows, params) {
    const P = { ...DEFAULT_PARAMS, ...(params || {}) };
    const base = rows.filter(r => r.dias >= P.minDias && r.sprPas > 0 && r.pasPedDia > 0 && r.bulkyPct != null);
    let coef = null, r2 = null;
    const feats = r => [1, r.bulkyPct, r.gPct || 0, r.motoShare || 0, Math.log(r.pasPedDia)];
    if (base.length >= 12) {

    const bulkyP75 = quantile(base.map(r => r.bulkyPct), 0.75);
    const out = rows.map(r => {

      if (!(r.dias >= P.minDias && r.sprPas > 0)) { o.motivos.push(`Poucos dias no período (${r.dias}); mínimo ${P.minDias}.`); return o; }
      if (coef) { o.esperado = feats(r).reduce((s, v, i) => s + v * coef[i], 0); o.resid = r.sprPas - o.esperado; }
      o.ufMed = ufMed.get(r.uf);

      const passo = P.passoMax / 100;

        if (abaixoPerfil) o.motivos.push(`SPR passeio ${f0(r.sprPas)} contra ${f0(o.esperado)} de referência para o perfil do hub (${f1(o.resid)}).`);
        o.motivos.push(`Órfãos ${f1(r.orfPct)}% e não roteirizados ${f1(r.naoRotPct)}%: há margem para carregar mais as rotas.`);

        if (o.resid != null) o.motivos.push(`SPR passeio ${f0(r.sprPas)} ${o.resid >= 0 ? 'acima' : 'perto'} do esperado (${f0(o.esperado)}).`);

      }

  // ---------- modal & vans ----------

  // ---------- órfãos (aba Órfãos) ----------

      throw e;
    }
  }
  // lê linhas [r1..r2] e, se o bloco for grande demais para uma chamada, divide em dois
  async function readRows(mcp, id, sheet, lastCol, r1, r2) {
    try {
      const p = await sheetsCall(mcp, 'get_values', { spreadsheetId: id, range: `${qs(sheet)}!A${r1}:${lastCol}${r2}` });
      return (p && p.values) || [];
    } catch (e) {
      if (e && AUTH.has(e.code)) throw e;
      if (e && e.code === 'tool_error' && /not found|unavailable|n[aã]o encontrad/i.test(e.message || '')) throw e;
      if (r2 - r1 < 150) throw e;
      const mid = Math.floor((r1 + r2) / 2);
      const a = await readRows(mcp, id, sheet, lastCol, r1, mid);
      const b = await readRows(mcp, id, sheet, lastCol, mid + 1, r2);
      // completa linhas vazias do bloco de cima para manter a ordem
      while (a.length < mid - r1 + 1 && b.length) a.push([]);
      return a.concat(b);
    }
  }
  async function pool(tasks, n, onDone) {
    const out = new Array(tasks.length); let i = 0, done = 0;
    const worker = async () => { while (i < tasks.length) { const k = i++; out[k] = await tasks[k](); done++; onDone && onDone(done, tasks.length); } };
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, worker));
    return out;
  }
  const cellsToRow = r => r.map(v => v === '' ? null : v);

  async function loadSheets(isRefresh) {
    const id = sheetIdOf(S.sheetLink);
    if (!id) { renderDrop('Cole o link completo da planilha (docs.google.com/spreadsheets/d/...).', 'Link inválido.'); return; }
    const mcp = await getMcp();
    if (!mcp) { renderDrop('Esse modo só funciona com o app aberto dentro do Claude.', 'Google Sheets indisponível.'); return; }
    S.source = 'sheets'; S.fileName = 'Google Sheets';
    $('#tabs').hidden = true; $('#filters').hidden = true;
    renderProgress('Conectando ao Google Sheets', 0.01);
    const t0 = performance.now();
    try {
      const meta = await sheetsCall(mcp, 'get_spreadsheet', { spreadsheetId: id, fields: ['properties.title', 'sheets.properties.title', 'sheets.properties.gridProperties'] });
      const sheets = ((meta && meta.sheets) || []).map(x => ({ title: x.properties.title, rows: x.properties.gridProperties.rowCount, cols: x.properties.gridProperties.columnCount }));
      S.fileName = (meta && meta.properties && meta.properties.title) || 'Google Sheets';
      const find = pred => sheets.find(x => pred(XL.norm(x.title)));
      const shMain = find(n => n === 'rofi_3.0') || find(n => /^rofi[_ ]?3/.test(n));
      const shSup = find(n => n === 'suporte');
      const shOrf = find(n => n === 'orfaos');
      if (!shMain) throw { code: 'no_main', message: 'Não encontrei a aba ROFI_3.0 nessa planilha. Abas: ' + sheets.map(x => x.title).join(', ') };
      const withOrf = shOrf && S.orfDays !== 0;
      const W = { main: 0.55, sup: 0.05, orf: withOrf ? 0.4 : 0 }; const tot = W.main + W.sup + W.orf;
      let base = 0;

      // ROFI_3.0
      const CH = 2000; const lc = colLetter(shMain.cols);
      const tasks = []; for (let r = 1; r <= shMain.rows; r += CH) { const a = r, b = Math.min(shMain.rows, r + CH - 1); tasks.push(() => readRows(mcp, id, shMain.title, lc, a, b)); }
      const parts = await pool(tasks, 3, (d, n) => setProgress(`Lendo ${shMain.title} (${d} de ${n} blocos)`, (base + W.main * d / n) / tot));
      base += W.main;
      let header = null; const rows = [];
      for (const part of parts) for (const r of part) {
        if (!header) { const ns = r.map(XL.norm); if (ns.includes('spr_final') || (ns.includes('hub') && ns.includes('analista'))) header = r.map(v => String(v || '').trim()); continue; }
        if (r.some(v => v !== '' && v != null)) rows.push(cellsToRow(r));
      }
      if (!header) throw { code: 'no_main', message: 'Não encontrei o cabeçalho da aba ROFI_3.0.' };

      // Suporte
      let suporte = null;
      if (shSup) {
        setProgress('Lendo Suporte', base / tot);
        const v = await readRows(mcp, id, shSup.title, colLetter(Math.min(shSup.cols, 15)), 1, shSup.rows);
        if (v.length) { const hd = v[0].map(x => String(x || '').trim()); suporte = { header: hd, rows: v.slice(1).filter(r => r.some(x => x !== '')).map(cellsToRow) }; }
        base += W.sup;
      }

      // Órfãos: de baixo para cima, até passar do período pedido
      let orfaos = null, orfRange = null;
      if (withOrf) {
        const B = XL.orfBuilder();
        const hd = await readRows(mcp, id, shOrf.title, 'L', 1, 1);
        if (hd.length) B.setHeader(hd[0]);
        // última linha com dado (o Sheets corta as linhas vazias do fim)
        setProgress('Procurando o fim da aba Órfãos', base / tot);
        let last = 0, top = shOrf.rows;
        while (top > 1 && !last) {
          const from = Math.max(2, top - 60000 + 1);
          const v = await readRows(mcp, id, shOrf.title, 'A', from, top);
          if (v.length) last = from + v.length - 1; else top = from - 1;
        }
        const today = new Date(); const todayS = Math.round((Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) - Date.UTC(1899, 11, 30)) / 864e5);
        const cutoff = S.orfDays > 0 ? todayS - S.orfDays - 1 : -Infinity;
        const OCH = 10000; let end = last, stop = false, read = 0;
        const span = S.orfDays > 0 ? Math.min(last, S.orfDays * 12000) : last;
        while (end >= 2 && !stop) {
          const ranges = []; for (let k = 0; k < 3 && end >= 2; k++) { const a = Math.max(2, end - OCH + 1); ranges.push([a, end]); end = a - 1; }
          const got = await Promise.all(ranges.map(([a, b]) => readRows(mcp, id, shOrf.title, 'K', a, b)));
          let allOld = true;
          got.forEach(v => { let mx = -Infinity; for (const r of v) { const d = B.push(r); if (d != null && d > mx) mx = d; } if (mx >= cutoff) allOld = false; read += v.length; });
          if (S.orfDays > 0 && allOld) stop = true;
          setProgress(`Lendo Órfãos (${F.n0(read)} linhas)`, (base + W.orf * Math.min(1, read / Math.max(1, span))) / tot);
        }
        orfaos = B.finish();
        orfRange = { days: S.orfDays, minDay: orfaos.minDay, maxDay: orfaos.maxDay, rows: read };
      }
      setProgress('Montando as análises', 1);
      await sleep(30);
      S.sheetLoadedAt = new Date();
      onParsed({ sheets: sheets.map(x => x.title), main: { header, rows }, suporte, orfaos, hasOrfaosSheet: !!shOrf, orfRange }, t0);
    } catch (e) {
      console.error(e);
      renderDrop(sheetsErrorText(e), 'Não consegui ler do Google Sheets.');
    }
  }

  function sheetsErrorText(e) {
    const code = e && e.code, msg = (e && e.message) || '';
    switch (code) {
      case 'needs_reauth': return 'O login do Google Sheets expirou. Reconecte em Configurações → Customize → Connectors → Google Sheets e tente de novo.';
      case 'server_not_connected': case 'server_not_found': return 'O conector Google Sheets não está conectado na sua conta do Claude. Conecte em Configurações → Customize → Connectors.';
      case 'selection_required': return 'Você tem mais de um conector Google Sheets. Escolha qual usar no aviso do Claude e tente de novo.';
      case 'not_in_manifest': case 'consent_required': return 'O acesso ao Google Sheets não foi permitido para este app. Clique em "Ler do Google Sheets" de novo e permita quando o Claude perguntar.';
      case 'approval_required': return 'O Claude precisa da sua permissão para o app ler a planilha. Clique em "Ler do Google Sheets" de novo e aceite o pedido.';
      case 'blocked_by_policy': return 'A sua organização bloqueia o uso deste conector.';
      case 'not_granted': case 'capability_disabled': case 'capability_removed': return 'Esse modo só funciona com o app aberto dentro do Claude.';
      case 'tool_error': return /not found|unavailable/i.test(msg) ? 'A planilha não foi encontrada para a conta do Google conectada. Confira o link e se essa conta tem acesso ao ROFI.' : 'O Google Sheets respondeu com erro: ' + msg;
      case 'server_unavailable': case 'upstream_error': return 'O Google Sheets não respondeu agora. Espere um pouco e tente de novo.';
      case 'no_main': return msg;
      default: return 'Erro inesperado' + (code ? ` (${code})` : '') + (msg ? ': ' + msg : '.');

  }

      { key: 'naoRotPct', label: 'Não rot. %', num: 1, fmt: F.pct }, { key: 'orfPct', label: 'Órfãos %', num: 1, fmt: F.pct }, { key: 'tempoMed', label: 'Tempo médio', num: 1, fmt: v => F.n0(v) + ' min' }],
      rows: cic, sort: ['n', -1], exportName: 'rofi_por_ciclo' }));
  };

  function resumoTexto() {
    const A = D.total(), R = D.recRows(), Q = D.qual();
    const sub = R.filter(r => r.rec === 'subir').sort((a, b) => b.score - a.score), bai = R.filter(r => r.rec === 'baixar').sort((a, b) => b.score - a.score);
    const lst = arr => arr.slice(0, 5).map(r => `${r.nome} (${F.n0(r.sprPas)} → ${F.n0(r.alvo)})`).join('; ') || 'nenhum';
    const topRules = Q.rules.filter(r => r.rows.length).sort((a, b) => b.rows.length - a.rows.length).slice(0, 3).map(r => `${r.label.toLowerCase()} (${r.rows.length})`).join(', ');
    return [
      `ROFI · ${periodTxt()}${S.f.uf ? ' · ' + S.f.uf : ''}${S.f.hub ? ' · ' + (S.model.hubs.get(S.f.hub) || {}).short : ''}`,
      `• ${F.n0(A.n)} roteirizações, ${F.compact(A.pedRot)} pedidos e ${F.n0(A.rotas)} rotas. SPR geral ${F.n1(A.spr)} (passeio ${F.n1(A.sprPas)}, moto ${F.n1(A.sprMoto)}).`,
      `• Não roteirizados ${F.pct(A.naoRotPct)} e órfãos iniciais ${F.pct(A.orfPct)}.`,
      `• Subir SPR: ${sub.length} hubs, economia estimada de ${F.n0(-sub.reduce((s2, r) => s2 + (r.impactoRotasDia || 0), 0))} rotas/dia. Principais: ${lst(sub)}.`,
      `• Baixar SPR: ${bai.length} hubs com órfãos/não roteirizados acima do limite. Principais: ${lst(bai)}.`,
      `• Qualidade do ROFI: ${F.n0(Q.comErro)} roteirizações com algum erro (${F.pct(Q.comErro / Q.total * 100)}). Mais comuns: ${topRules || 'nenhum'}.`,
    ].join('\n');
  }


  // SEMANA × SEMANA
  VIEWS.semana = () => {
    const W = S.wk; const wk = D.wk(); const ws = D.weeks();
    const thr = Number(W.thr) || 5;
    const mLabel = W.metric === 'passeio' ? 'SPR passeio' : 'SPR geral';
    const per = r => `${F.date(r[0])} a ${F.date(r[1])}`;
    main.append(h('h2', null, 'Semana × semana'), h('p', { class: 'lead' }, `${mLabel} de ${per(wk.cur)} contra ${per(wk.prev)}. Nesta aba o filtro de período não vale; ciclo, modo, UF e analista valem.`));
    const setW = (k, v) => { W[k] = v; LS.set({ mode: 'wkMode', metric: 'wkMetric', thr: 'wkThr' }[k] || 'wk_' + k, v); W.sel = null; route(); };
    main.append(h('div', { class: 'filters', style: { borderBottom: 0, paddingTop: 0 } },
      h('div', { class: 'fgroup' }, h('label', null, 'Comparar'), h('div', { class: 'seg' },
        h('button', { class: W.mode === 'week' ? 'on' : '', onclick: () => setW('mode', 'week') }, 'Semanas (seg a dom)'),
        h('button', { class: W.mode === 'rolling' ? 'on' : '', onclick: () => setW('mode', 'rolling') }, 'Últimos 7 dias')),
        W.mode === 'week' ? h('select', { onchange: e => { W.week = e.target.value; W.sel = null; route(); } }, ws.slice(0, -1).map(x => h('option', { value: x.start, selected: x.start === W.week }, `${F.date(x.start)} a ${F.date(x.end)}${S.model.maxDate < x.end ? ' (em andamento)' : ''}`))) : null),
      h('div', { class: 'fgroup' }, h('label', null, 'Métrica'), h('div', { class: 'seg' },
        h('button', { class: W.metric === 'geral' ? 'on' : '', onclick: () => setW('metric', 'geral') }, 'SPR geral'),
        h('button', { class: W.metric === 'passeio' ? 'on' : '', onclick: () => setW('metric', 'passeio') }, 'SPR passeio'))),
      h('div', { class: 'fgroup' }, h('label', null, 'Queda a partir de'), h('input', { type: 'number', min: 1, max: 50, step: 1, value: thr, onchange: e => setW('thr', Number(e.target.value) || 5) }), h('span', { class: 'muted' }, 'pontos'))));

    let rows = wk.rows.filter(r => r.delta != null);
    if (S.f.hub) rows = rows.filter(r => r.hub === S.f.hub);
    const drops = rows.filter(r => r.delta <= -thr).sort((a, b) => a.delta - b.delta);
    const ups = rows.filter(r => r.delta >= thr);
    const extra = drops.reduce((s2, r) => s2 + Math.max(0, r.rotasExtraDia || 0), 0);
    main.append(h('div', { class: 'tiles' },
      tile(mLabel + ' da rede', `${F.n1(wk.net.sprPrev)} → ${F.n1(wk.net.sprCur)}`, `${F.sgn1(wk.net.delta)} pontos`),
      tile(`Hubs com queda de ${thr}+ pts`, F.n0(drops.length), `de ${F.n0(rows.length)} hubs com as duas semanas`),
      tile(`Hubs com alta de ${thr}+ pts`, F.n0(ups.length), null),
      tile('Rotas a mais por dia', F.n0(extra), 'custo das quedas, no volume da semana atual')));

    const sel = W.sel || S.f.hub || (drops[0] || {}).hub;
    main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },
      card('Maiores ofensores da semana', `hubs com queda de ${thr}+ pts, pelas rotas a mais por dia`, chartBox(el => barList(el, {
        items: drops.filter(r => r.rotasExtraDia > 0).sort((a, b) => b.rotasExtraDia - a.rotasExtraDia).map(r => ({ label: r.nome, value: r.rotasExtraDia, r, color: 'var(--serious)' })),
        fmt: v => F.n1(v), limit: 12, onClick: it => { W.sel = it.r.hub; route(); },
        tipRows: it => [{ label: mLabel, value: `${F.n1(it.r.sprPrev)} → ${F.n1(it.r.sprCur)}` }, { label: 'Variação', value: F.sgn1(it.r.delta) + ' pts' }, { label: 'Rotas/dia a mais', value: F.n1(it.r.rotasExtraDia) }] }))),
      card('Maiores quedas de SPR', 'em pontos', chartBox(el => barList(el, {
        items: drops.map(r => ({ label: r.nome, value: -r.delta, r, color: 'var(--serious)' })), fmt: v => '−' + F.n1(v), limit: 12, onClick: it => { W.sel = it.r.hub; route(); },
        tipRows: it => [{ label: mLabel, value: `${F.n1(it.r.sprPrev)} → ${F.n1(it.r.sprCur)}` }, ...(it.r.drivers || []).slice(0, 2)] })))));

    // detalhe do hub selecionado
    if (sel && rows.some(r => r.hub === sel)) {
      const r = rows.find(x => x.hub === sel);
      const det = Core.weekHubDetail(S.model, wk, sel, W.metric);
      const dr = det.dr;
      const down = r.delta < 0;
      const box = h('div', { class: 'card rec-card', id: 'wkdet', style: { borderLeftColor: down ? 'var(--serious)' : 'var(--good)', marginBottom: '14px' } },
        h('div', { class: 'head' }, h('h3', null, r.nome), h('span', null, `${mLabel} ${F.n1(r.sprPrev)} → `, h('b', null, F.n1(r.sprCur)), ` (${F.sgn1(r.delta)} pts)`),
          r.rotasExtraDia != null ? h('span', { class: 'sub' }, `${F.sgn1(r.rotasExtraDia)} rotas/dia · pedidos/dia ${F.n0(r.pedDiaPrev)} → ${F.n0(r.pedDiaCur)} · planejado ${F.n1(r.planPrev)} → ${F.n1(r.planCur)}`) : null,
          h('div', { class: 'actions' }, h('button', { class: 'btn small', onclick: () => goHub(sel) }, 'Abrir detalhe do hub'))),
        down ? h('div', null, h('b', null, 'O que explica a queda'),
          h('ul', { class: 'motivos' }, (dr.top.length ? dr.top : ['Nenhum recorte isolado explica a queda; ela aparece espalhada.']).map(t => h('li', null, t)), dr.ctx.map(t => h('li', null, t))),
          h('div', { class: 'note' }, 'Cada linha olha a mesma queda por um recorte diferente (ciclo, modal, dia ou analista), por isso os pontos não se somam. O número diz quanto o SPR do hub estaria acima se aquela parte tivesse repetido a semana anterior.'))
          : h('ul', { class: 'motivos' }, dr.ctx.map(t => h('li', null, t)).concat([h('li', null, 'O SPR não caiu nesta comparação.')])));
      main.append(box);
      const segCols = keyLabel => [
        { key: 'key', label: keyLabel, render: x => h('b', null, keyLabel === 'Dia' ? Core.WD[x.key] : keyLabel === 'Analista' ? String(x.key).replace(/@.*/, '') : x.key), csv: x => x.key },
        { key: 'sprPrev', label: 'SPR ant.', num: 1, fmt: F.n1 }, { key: 'sprCur', label: 'SPR atual', num: 1, fmt: F.n1 },
        { key: 'shareCur', label: '% rotas', num: 1, render: x => `${F.n0(x.sharePrev)}% → ${F.n0(x.shareCur)}%`, sortVal: x => x.shareCur },
        { key: 'contrib', label: 'Impacto', num: 1, render: x => x.contrib == null ? (x.sumiu ? 'saiu' : 'novo') : h('span', { class: x.contrib < -0.05 ? 'neg' : x.contrib > 0.05 ? 'pos' : '' }, F.sgn1(x.contrib) + ' pts'), sortVal: x => x.contrib ?? 0, csv: x => x.contrib },
      ];
      const segTable = (title, c, keyLabel) => table({ title, rows: c.parts, sort: null, limit: 20, maxHeight: '320px', cols: segCols(keyLabel) });
      main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },
        card('SPR por dia da semana', `${per(wk.prev)} × ${per(wk.cur)}`, chartBox(el => lineChart(el, { x: Core.WD, xFmt: v => v, height: 220, series: [{ name: 'Semana anterior', color: color(1), values: det.wd0, fmt: F.n1 }, { name: 'Semana atual', color: color(0), values: det.wd1, fmt: F.n1 }] }))),
        segTable('Por ciclo', dr.byCiclo, 'Ciclo')));
      main.append(h('div', { class: 'grid g3', style: { marginBottom: '14px' } },
        dr.byModal ? h('div', null, segTable('Por modal', dr.byModal, 'Modal'), dr.byModal.mix != null ? h('p', { class: 'note' }, `Efeito da mudança no mix de modal: ${F.sgn1(dr.byModal.mix)} pts.`) : null) : h('div', { class: 'card' }, h('h3', null, 'Por modal'), h('div', { class: 'muted' }, 'Só no SPR geral.')),
        segTable('Por dia da semana', dr.byDay, 'Dia'),
        segTable('Por analista', dr.byAn, 'Analista')));
      main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },
        card('Justificativas na semana atual', null, chartBox(el => barList(el, { items: det.just.map(x => ({ label: x.key, value: x.n })), limit: 8 }))),
        card('Clusters ofensores na semana atual', 'órfãos citados no ROFI', chartBox(el => barList(el, { items: det.clusters.map(([k, v]) => ({ label: k, value: v })), limit: 8 })))));
      main.append(table({ title: 'Roteirizações da semana atual', sub: 'comparadas com o SPR do mesmo ciclo na semana anterior', exportName: 'rofi_semana_' + sel, rows: det.ops, sort: ['dif', 1], limit: 40,
        cols: [{ key: 'date', label: 'Data', val: x => x.o.date, fmt: F.dateY }, { key: 'wd', label: 'Dia', val: x => Core.WD[Core.weekdayOf(x.o.date)] }, { key: 'ciclo', label: 'Ciclo', val: x => x.o.ciclo },
          { key: 'analista', label: 'Analista', val: x => (x.o.analista || '').replace(/@.*/, '') }, { key: 'ped', label: 'Pedidos', num: 1, val: x => W.metric === 'passeio' ? x.o.pasPed : x.o.pedRot, fmt: F.n0 },
          { key: 'rot', label: 'Rotas', num: 1, val: x => W.metric === 'passeio' ? x.o.pasRot : x.o.rotasFinal, fmt: F.n0 },
          { key: 'spr', label: 'SPR', num: 1, fmt: F.n1 }, { key: 'ref', label: 'Ref. sem. ant.', num: 1, fmt: F.n1 }, { key: 'dif', label: 'Diferença', num: 1, render: x => x.dif == null ? '—' : h('span', { class: x.dif <= -thr ? 'neg' : '' }, F.sgn1(x.dif)), csv: x => x.dif },
          { key: 'plan', label: 'SPR plan.', num: 1, val: x => W.metric === 'passeio' ? x.o.pasSprP : x.o.sprPlan, fmt: F.n0 }, { key: 'just', label: 'Justificativa', val: x => x.o.just, wrap: 1 }] }));
      main.append(h('div', { style: { height: '14px' } }));
    }

    main.append(table({ title: 'Todos os hubs', search: true, exportName: 'rofi_semana_x_semana', rows: rows.slice().sort((a, b) => a.delta - b.delta), sort: null, limit: 300,
      onRow: r => { W.sel = r.hub; route(); requestAnimationFrame(() => { const el = document.getElementById('wkdet'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); },
      extra: h('button', { class: 'btn small', onclick: () => copyText(ofensoresTexto(), 'Ofensores copiados.') }, 'Copiar ofensores'),
      cols: [
        { key: 'nome', label: 'Hub', render: r => h('b', null, r.nome) }, { key: 'uf', label: 'UF' },
        { key: 'sprPrev', label: 'SPR ant.', num: 1, fmt: F.n1 }, { key: 'sprCur', label: 'SPR atual', num: 1, fmt: F.n1 },
        { key: 'delta', label: 'Variação', num: 1, render: r => r.delta <= -thr ? h('span', { class: 'badge' }, h('i', { style: { background: 'var(--serious)' } }), F.sgn1(r.delta)) : h('span', { class: r.delta >= thr ? 'pos' : '' }, F.sgn1(r.delta)), sortVal: r => r.delta, csv: r => r.delta },
        { key: 'rotasExtraDia', label: 'Rotas/dia', num: 1, fmt: F.sgn1, title: 'Rotas a mais (+) ou a menos (−) por dia por causa da variação de SPR' },
        { key: 'pedDiaCur', label: 'Pedidos/dia', num: 1, render: r => `${F.n0(r.pedDiaPrev)} → ${F.n0(r.pedDiaCur)}`, sortVal: r => r.pedDiaCur, csv: r => r.pedDiaCur },
        { key: 'planCur', label: 'SPR plan.', num: 1, render: r => `${F.n0(r.planPrev)} → ${F.n0(r.planCur)}`, sortVal: r => (r.planCur || 0) - (r.planPrev || 0), csv: r => r.planCur },
        { key: 'drivers', label: 'Principais ofensores', wrap: 1, val: r => (r.drivers || []).join(' · '), clip: 200 },
      ] }));
  };

  function ofensoresTexto() {
    const W = S.wk, wk = D.wk(), thr = Number(W.thr) || 5;
    const mLabel = W.metric === 'passeio' ? 'SPR passeio' : 'SPR geral';
    const drops = wk.rows.filter(r => r.delta != null && r.delta <= -thr).sort((a, b) => a.delta - b.delta);
    const lines = [`Ofensores da semana · ${mLabel} · ${F.date(wk.cur[0])} a ${F.date(wk.cur[1])} contra ${F.date(wk.prev[0])} a ${F.date(wk.prev[1])}`,
      `Rede: ${F.n1(wk.net.sprPrev)} → ${F.n1(wk.net.sprCur)} (${F.sgn1(wk.net.delta)} pts). ${drops.length} hubs caíram ${thr}+ pontos.`];
    for (const r of drops.slice(0, 15)) lines.push(`• ${r.nome}: ${F.n1(r.sprPrev)} → ${F.n1(r.sprCur)} (${F.sgn1(r.delta)}; ${F.sgn1(r.rotasExtraDia)} rotas/dia). ${(r.drivers || []).slice(0, 2).join('; ')}`);
    return lines.join('\n');
  }

  // SPR SUBIR/BAIXAR
  VIEWS.spr = () => {
    const RR = D.rec(); const rows = D.recRows(); const P = S.params;
    main.append(h('h2', null, 'SPR: subir ou baixar'), h('p', { class: 'lead' }, `Cada hub é comparado com o próprio histórico e com hubs de perfil parecido, olhando o SPR de passeio (o que o template controla). ${periodTxt()}.`));
    main.append(how('Como a recomendação é feita', `
      <b>Subir</b> quando o hub tem folga (órfãos ≤ ${F.n1(P.orfMax)}% e não roteirizados ≤ ${F.n1(P.nrMax)}%) e o SPR passeio está pelo menos ${P.gap} abaixo de uma destas referências:
      <br>• <b>SPR comprovado</b>: o nível que o próprio hub sustentou nos dias sem estresse (mediana dos dias com órfãos e não roteirizados baixos, mínimo 5 dias);
      <br>• <b>Referência de perfil</b>: o SPR esperado para o % de bulky, % de G, participação de moto e volume diário do hub, calculado com todos os hubs do recorte (R² ${RR.r2 == null ? '—' : F.n1(RR.r2 * 100) + '%'}: o perfil explica só parte da diferença entre hubs, então use como apoio).
      <br><b>Baixar</b> quando órfãos ≥ ${F.n1(P.alertaOrf)}% ou não roteirizados ≥ ${F.n1(P.alertaNr)}% e o SPR não está abaixo das referências, ou quando o SPR está acima da referência com perfil pesado (bulky no quartil mais alto) e órfãos.
      <br><b>Revisar</b> quando o SPR passeio diário oscila mais de ${P.cvMax}% (faixa entre os dias 10% e 90%) em torno da mediana.
      <br>O <b>alvo</b> respeita um passo máximo de ${P.passoMax}% por ajuste. O impacto em rotas por dia considera só os pedidos de passeio.`));

    // parâmetros
    const inp = (k, label, step, min, max) => h('label', null, label, h('input', { type: 'number', value: P[k], step, min, max, onchange: e => { const v = Number(e.target.value); if (isFinite(v)) { S.params[k] = v; LS.set('params', S.params); S.cache = {}; renderTabs(); route(); } } }));
    main.append(h('details', { class: 'card', style: { marginBottom: '14px' } }, h('summary', { style: { cursor: 'pointer', fontWeight: 600 } }, 'Ajustar critérios'),
      h('div', { class: 'params' },
        inp('minDias', 'Mínimo de dias com dados', 1, 1, 60), inp('gap', 'Distância mínima da referência (SPR)', 1, 1, 50),
        inp('orfMax', 'Folga: órfãos até (%)', 0.1, 0, 10), inp('nrMax', 'Folga: não roteirizados até (%)', 0.1, 0, 10),
        inp('alertaOrf', 'Alerta: órfãos a partir de (%)', 0.1, 0, 20), inp('alertaNr', 'Alerta: não roteirizados a partir de (%)', 0.1, 0, 20),
        inp('passoMax', 'Passo máximo por ajuste (%)', 1, 1, 30), inp('cvMax', 'Oscilação para revisar (%)', 1, 5, 200)),
      h('div', { style: { marginTop: '10px' } }, h('button', { class: 'btn small', onclick: () => { S.params = Object.assign({}, Core.DEFAULT_PARAMS); LS.set('params', S.params); S.cache = {}; renderTabs(); route(); } }, 'Voltar ao padrão'))));

    const cnt = k => rows.filter(r => r.rec === k);
    const imp = k => cnt(k).reduce((s2, r) => s2 + (r.impactoRotasDia || 0), 0);
    const setF = k => { S.recFilter = S.recFilter === k ? 'todos' : k; route(); };
    main.append(h('div', { class: 'tiles' },
      tile('↑ Subir SPR', F.n0(cnt('subir').length) + ' hubs', `economia de ${F.n0(-imp('subir'))} rotas/dia`, { onclick: () => setF('subir'), sel: S.recFilter === 'subir' }),
      tile('↓ Baixar SPR', F.n0(cnt('baixar').length) + ' hubs', `+${F.n0(imp('baixar'))} rotas/dia`, { onclick: () => setF('baixar'), sel: S.recFilter === 'baixar' }),
      tile('! Revisar', F.n0(cnt('revisar').length) + ' hubs', 'SPR instável entre os dias', { onclick: () => setF('revisar'), sel: S.recFilter === 'revisar' }),
      tile('= Manter', F.n0(cnt('manter').length) + ' hubs', 'dentro do esperado', { onclick: () => setF('manter'), sel: S.recFilter === 'manter' }),
      tile('Saldo líquido', F.sgn0(imp('subir') + imp('baixar')) + ' rotas/dia', 'se todos os ajustes forem aplicados')));

    const groups = [{ key: 'subir', label: 'Subir', color: css('--good') }, { key: 'baixar', label: 'Baixar', color: css('--serious') }, { key: 'revisar', label: 'Revisar', color: css('--warn') }, { key: 'manter', label: 'Manter', color: css('--neutral') }];
    main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },

        points: rows.filter(r => r.esperado != null && r.rec !== 'sem dados').map(r => ({ x: r.esperado, y: r.sprPas, group: r.rec, label: r.nome, hub: r.hub, r })),
        groups, xLabel: 'Referência de perfil (SPR passeio)', yLabel: 'SPR passeio real', onClick: p => goHub(p.hub),
        tipRows: p => [{ label: 'Real', value: F.n1(p.r.sprPas) }, { label: 'Referência', value: F.n1(p.r.esperado) }, { label: 'Comprovado', value: F.n1(p.r.provado) }, { label: 'Órfãos', value: F.pct(p.r.orfPct) }, { label: 'Não rot.', value: F.pct(p.r.naoRotPct) }, { label: 'Bulky', value: F.pct(p.r.bulkyPct) }, REC[p.r.rec].label],
      }))),
      card('Maior impacto em rotas por dia', 'economia (subir) e rotas extras (baixar)', chartBox(el => {

      }))));

    const ordem = { subir: 0, baixar: 1, revisar: 2, manter: 3, 'sem dados': 4 };
    const shown = S.recFilter === 'todos' ? rows : rows.filter(r => r.rec === S.recFilter);

        table({ title: 'Hubs', exportName: 'rofi_orfaos_hubs', rows: O.hubs, sort: ['n', -1], onRow: r => goHub(r.hub), limit: 50, search: true, maxHeight: '480px',
          cols: [{ key: 'nome', label: 'Hub', render: r => h('b', null, r.nome) }, { key: 'n', label: 'Órfãos', num: 1, fmt: F.n0 }, { key: 'nDias', label: 'Dias', num: 1, fmt: F.n0 },
            { key: 'real', label: 'Realoc. %', num: 1, val: r => r.real / r.n * 100, fmt: F.pct0 }, { key: 'nr', label: 'Não rot. %', num: 1, val: r => r.nr / r.n * 100, fmt: F.pct0 },
            { key: 'bulky', label: 'Bulky %', num: 1, val: r => r.bulky / r.n * 100, fmt: F.pct0 }, { key: 'vol', label: 'Litros', num: 1, fmt: F.n0 }] }),
        table({ title: 'Clusters', exportName: 'rofi_orfaos_clusters', rows: O.clusters, sort: ['n', -1], limit: 50, search: true, maxHeight: '480px',
          cols: [{ key: 'nome', label: 'Hub' }, { key: 'cluster', label: 'Cluster', render: r => h('b', null, r.cluster) }, { key: 'n', label: 'Órfãos', num: 1, fmt: F.n0 }, { key: 'nDias', label: 'Dias', num: 1, fmt: F.n0 },
            { key: 'nr', label: 'Não rot. %', num: 1, val: r => r.nr / r.n * 100, fmt: F.pct0 }, { key: 'bulky', label: 'Bulky %', num: 1, val: r => r.bulky / r.n * 100, fmt: F.pct0 }, { key: 'vol', label: 'Litros', num: 1, fmt: F.n0 }] })));
      main.append(card('Por ciclo', null, chartBox(el => barList(el, { items: O.ciclos.map(c => ({ label: c.key, value: c.n, c })), tipRows: it => [{ label: 'Pedidos', value: F.n0(it.c.n) }, { label: 'Não rot.', value: F.pct(it.c.nr / it.c.n * 100) }] }))));
      main.append(h('div', { style: { height: '14px' } }));
    }
    // do ROFI
    const m = new Map(); for (const o of L) for (const [nm, n] of Core.parseClusters(o.orfClusters)) { const k = o.hub + '|' + nm; let e = m.get(k); if (!e) m.set(k, e = { hub: o.hub, nome: o.hubShort, cluster: nm, n: 0, vezes: 0 }); e.n += n; e.vezes++; }
    main.append(h('div', { class: 'grid g2' },
      card('Órfãos iniciais por dia (ROFI)', `${F.pct(A.orfPct)} dos pedidos planejados`, chartBox(el => { const d = Core.daily(L); lineChart(el, { x: d.map(x => x.key), height: 220, zero: true, series: [{ name: 'Órfãos iniciais', color: color(0), values: d.map(x => x.orfIni) }, { name: 'Bulky', color: color(1), values: d.map(x => x.orfBulky) }] }); })),
      table({ title: 'Clusters ofensores citados no ROFI', exportName: 'rofi_clusters_ofensores', rows: [...m.values()], sort: ['n', -1], onRow: r => goHub(r.hub), limit: 30, search: true, maxHeight: '420px',
        cols: [{ key: 'nome', label: 'Hub' }, { key: 'cluster', label: 'Cluster', render: r => h('b', null, r.cluster) }, { key: 'n', label: 'Órfãos', num: 1, fmt: F.n0 }, { key: 'vezes', label: 'Roteirizações', num: 1, fmt: F.n0 }] })));
  };

  // QUALIDADE
  VIEWS.qualidade = () => {
    const Q = D.qual();
    main.append(h('h2', null, 'Qualidade do ROFI'), h('p', { class: 'lead' }, `Problemas de preenchimento encontrados nas roteirizações de ${periodTxt()} (inclui NOK, EXTRA e linhas repetidas). Clique numa regra para ver as linhas.`));
    main.append(h('div', { class: 'tiles' },
      tile('Roteirizações verificadas', F.n0(Q.total), null), tile('Com algum problema', F.n0(Q.comErro), F.pct(Q.comErro / Q.total * 100) + ' do total'),
      tile('Versão de referência do Fluxo', S.model.latestVersion || '—', 'mais nova em uso nos últimos 3 dias')));
    const grid = h('div', { class: 'rules' });
    for (const r of Q.rules) {
      grid.append(h('div', { class: 'rule' + (S.ruleSel === r.id ? ' sel' : ''), onclick: () => { S.ruleSel = S.ruleSel === r.id ? null : r.id; route(); } },
        h('div', { class: 'top' }, h('span', { class: 'lbl' }, r.label), sevBadge(r.sev)),
        h('div', { class: 'top' }, h('span', { class: 'n' }, F.n0(r.rows.length)), h('span', { class: 'muted' }, F.pct(r.rows.length / Q.total * 100))),
        h('div', { class: 'ds' }, r.desc)));
    }
    main.append(grid);
    const sel = Q.rules.filter(r => !S.ruleSel || r.id === S.ruleSel);
    const linhas = sel.flatMap(r => r.rows.map(x => ({ ...x, regra: r.label, sev: r.sev })));
    main.append(h('div', { class: 'grid', style: { gridTemplateColumns: 'minmax(0,2fr) minmax(0,1fr)', marginBottom: '14px' } },
      table({ title: S.ruleSel ? Q.rules.find(r => r.id === S.ruleSel).label : 'Todas as ocorrências', search: true, exportName: 'rofi_erros' + (S.ruleSel ? '_' + S.ruleSel : ''), rows: linhas, sort: ['date', -1], limit: 150, maxHeight: '560px',
        extra: S.ruleSel ? h('button', { class: 'btn small', onclick: () => { S.ruleSel = null; route(); } }, 'Ver todas') : null,
        cols: [
          { key: 'date', label: 'Data', val: r => r.o.date || r.o.dp, fmt: F.dateY }, { key: 'hub', label: 'Hub', val: r => r.o.hubShort || r.o.hubNome || r.o.hub },
          { key: 'analista', label: 'Analista', val: r => (r.o.analista || '').replace(/@.*/, '') }, { key: 'ciclo', label: 'Ciclo', val: r => r.o.cicloRaw },
          { key: 'regra', label: 'Problema' }, { key: 'detalhe', label: 'Detalhe', wrap: 1 },
          { key: 'linha', label: 'Linha', num: 1, val: r => r.o._line, title: 'Linha na aba ROFI_3.0' }, { key: 'id', label: 'ID', val: r => r.o.id },
        ] }),
      table({ title: 'Por analista', search: true, exportName: 'rofi_erros_analistas', rows: Q.analysts.filter(a => a.erros), sort: ['opsComErro', -1], limit: 100, maxHeight: '560px',
        onRow: r => { S.f.analista = r.analista; refresh(); },
        cols: [{ key: 'analista', label: 'Analista', val: r => r.analista.replace(/@.*/, '') }, { key: 'ops', label: 'Rots.', num: 1, fmt: F.n0 }, { key: 'opsComErro', label: 'Com erro', num: 1, fmt: F.n0 }, { key: 'pct', label: '%', num: 1, fmt: F.pct0 },
          { key: 'top', label: 'Mais comum', val: r => { const e = Object.entries(r.porRegra).sort((a, b) => b[1] - a[1])[0]; return e ? Q.rules.find(x => x.id === e[0]).label : ''; } }] })));
    main.append(h('p', { class: 'note' }, 'Clique num analista para filtrar o app inteiro por ele. Linhas marcadas como reprocessadas ou com ID duplicado ficam fora das demais análises.'));
  };

  // ANALISTAS
  VIEWS.analistas = () => {
    const rows = D.analysts(); const L = D.list();
    main.append(h('h2', null, 'Analistas'), h('p', { class: 'lead' }, `Volume, tempo e qualidade por analista em ${periodTxt()}. Tempos acima de 180 min ficam fora da média.`));
    const vers = Core.countBy(L.filter(o => o.dp && o.dp >= Core.addDays(S.model.today, -3)), o => o.versao);
    main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },
      card('Tempo médio de roteirização', 'analistas com 5+ roteirizações · minutos', chartBox(el => barList(el, { items: rows.filter(r => r.n >= 5 && r.tempoMed).sort((a, b) => b.tempoMed - a.tempoMed).map(r => ({ label: r.analista.replace(/@.*/, ''), value: r.tempoMed, r })), fmt: F.n0, limit: 15, tipRows: it => [{ label: 'Tempo médio', value: F.n0(it.r.tempoMed) + ' min' }, { label: 'Roteirizações', value: F.n0(it.r.n) }] }))),
      card('Versões do Fluxo em uso', 'roteirizações processadas nos últimos 3 dias', chartBox(el => barList(el, { items: vers.map(v => ({ label: v.key, value: v.n, color: v.key === S.model.latestVersion ? 'var(--s1)' : 'var(--s2)' })), limit: 10 })))));
    main.append(table({ title: 'Por analista', search: true, exportName: 'rofi_analistas', rows, sort: ['n', -1], limit: 300, onRow: r => { S.f.analista = r.analista; refresh(); },
      cols: [{ key: 'analista', label: 'Analista', val: r => r.analista.replace(/@.*/, '') }, { key: 'n', label: 'Rots.', num: 1, fmt: F.n0 }, { key: 'dias', label: 'Dias', num: 1, fmt: F.n0 }, { key: 'opsDia', label: 'Rots./dia', num: 1, fmt: F.n1 },
        { key: 'hubs', label: 'Hubs', num: 1, fmt: F.n0 }, { key: 'pedidos', label: 'Pedidos', num: 1, fmt: F.n0 }, { key: 'tempoMed', label: 'Tempo médio', num: 1, fmt: F.n0 }, { key: 'tempoMediana', label: 'Mediana', num: 1, fmt: F.n0 },
        { key: 'sprPas', label: 'SPR passeio', num: 1, fmt: F.n1 }, { key: 'justPct', label: 'Justif. %', num: 1, fmt: F.pct0 }, { key: 'errosPct', label: 'Com erro %', num: 1, fmt: F.pct0 },
        { key: 'ultVersao', label: 'Última versão', render: r => r.desatualizado ? h('span', { class: 'badge' }, h('i', { style: { background: 'var(--warn)' } }), r.ultVersao) : r.ultVersao, csv: r => r.ultVersao },
        { key: 'ultimaData', label: 'Último proc.', fmt: F.dateY }] }));
  };

  // SUPORTE
  VIEWS.suporte = () => {
    const U = D.sup();
    main.append(h('h2', null, 'Suporte'), h('p', { class: 'lead' }, `Conferências registradas na aba Suporte em ${periodTxt()}.`));
    if (!U) { main.append(h('div', { class: 'empty' }, 'O arquivo não tem a aba Suporte.')); return; }
    const sit = k => (U.sit.find(x => x.key === k) || { n: 0 }).n;
    main.append(h('div', { class: 'tiles' }, tile('Registros', F.n0(U.n), null), tile('OK', F.n0(sit('OK')), null), tile('Divergência', F.n0(sit('DIVERGÊNCIA')), null), tile('Aguardando', F.n0(sit('AGUARDANDO')), null), tile('Fora do padrão (parâmetros)', F.n0((U.par.find(x => x.key === 'Fora do padrão') || { n: 0 }).n), null)));
    main.append(h('div', { class: 'grid g3', style: { marginBottom: '14px' } },
      card('Situação', null, chartBox(el => barList(el, { items: U.sit.map(x => ({ label: x.key, value: x.n })) }))),
      card('Parâmetros', null, chartBox(el => barList(el, { items: U.par.map(x => ({ label: x.key, value: x.n })) }))),
      card('Versão', null, chartBox(el => barList(el, { items: U.versao.map(x => ({ label: x.key, value: x.n })), limit: 8 })))));
    main.append(h('div', { class: 'grid g2', style: { marginBottom: '14px' } },
      table({ title: 'Hubs', search: true, exportName: 'rofi_suporte_hubs', rows: U.hubs, sort: ['div', -1], limit: 50, maxHeight: '460px',
        cols: [{ key: 'nome', label: 'Hub', render: r => h('b', null, r.nome) }, { key: 'n', label: 'Registros', num: 1, fmt: F.n0 }, { key: 'div', label: 'Divergência', num: 1, fmt: F.n0 }, { key: 'fora', label: 'Fora do padrão', num: 1, fmt: F.n0 }, { key: 'agu', label: 'Aguardando', num: 1, fmt: F.n0 }] }),
      table({ title: 'Analistas', search: true, exportName: 'rofi_suporte_analistas', rows: U.analistas, sort: ['n', -1], limit: 50, maxHeight: '460px',
        cols: [{ key: 'key', label: 'Analista', val: r => r.key.replace(/@.*/, '') }, { key: 'n', label: 'Registros', num: 1, fmt: F.n0 }] })));
    main.append(table({ title: 'Divergências e parâmetros fora do padrão', search: true, exportName: 'rofi_suporte_divergencias', rows: U.divergencias, sort: ['quando', -1], limit: 100,
      cols: [{ key: 'quando', label: 'Quando', sortVal: r => (r.quandoIso || '') + r.quando }, { key: 'hubShort', label: 'Hub' }, { key: 'ciclo', label: 'Ciclo' }, { key: 'date', label: 'Data', fmt: F.dateY },
        { key: 'analista', label: 'Analista', val: r => r.analista.replace(/@.*/, '') }, { key: 'versao', label: 'Versão' }, { key: 'cts', label: 'CTs', num: 1, fmt: F.n0 }, { key: 'sit', label: 'Situação' }, { key: 'par', label: 'Parâmetros', wrap: 1, clip: 160 }, { key: 'det', label: 'Detalhes', wrap: 1, clip: 260 }] }));
  };

  // ---------- início ----------
  renderDrop();
  window.__rofi = { S, D, load, resumoTexto, loadSheets, ofensoresTexto };
})();
</script>
</body>
</html>
